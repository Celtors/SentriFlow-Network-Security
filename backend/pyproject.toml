[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentriflow"
version = "0.1.0"
description = "Local, secure-by-design network privacy guardian"
requires-python = ">=3.12"
dependencies = [
  "mitmproxy>=12.3,<13",
  "fastapi>=0.143,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.10,<3",
  "psutil>=7.1,<8",
  "aiosqlite",
  "geoip2",
  "regex",
  "winotify; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "mypy", "pre-commit", "types-regex"]
browser = ["playwright>=1.64,<2", "httpx>=0.28,<1"]
ml = ["scikit-learn"]

[project.scripts]
sentriflow = "sentriflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentriflow = ["data/**/*", "web/**/*", "storage/*.sql", "storage/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sentriflow", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
